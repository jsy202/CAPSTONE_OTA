# Development/LAN broker. Keep this listener behind a trusted firewall.
listener 8883 0.0.0.0
allow_anonymous false
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
cafile /etc/capstone-ota/pki/ca.crt
certfile /etc/capstone-ota/pki/mqtt.crt
keyfile /etc/capstone-ota/pki/mqtt.key
acl_file /etc/mosquitto/acl.capstone
persistence true
persistence_location /var/lib/mosquitto/

