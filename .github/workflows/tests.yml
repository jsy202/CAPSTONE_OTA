name: minimal-ota-tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff>=0.6,<1'
      - name: Syntax errors and undefined names (blocking)
        run: ruff check .
      - name: Unused imports (advisory, does not fail the build)
        continue-on-error: true
        run: ruff check --select F401,F841 --exit-zero --statistics .
      - name: Spec names only test functions that exist
        run: python -m tools.ci.trace_matrix --check > /dev/null

  pytest:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test and cockpit extras
        run: python -m pip install '.[verification,cockpit]'
      - name: Console command
        run: ota --help
      - name: Virtual CAN interface for the CAN-verdict tests
        run: |
          sudo modprobe vcan || { sudo apt-get update && sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe vcan; }
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -details link show vcan0
      - name: Test real signed HTTP updates and A/B recovery
        run: python -m pytest -q --junitxml=artifacts/junit.xml --cov=capstone_ota --cov-branch --cov-report=xml:artifacts/coverage.xml --alluredir=artifacts/allure-results
      - name: CAN-verdict tests must not be skipped
        run: python -m tools.ci.skip_guard artifacts/junit.xml --forbid 'vcan0'
      - name: Skipped tests and TC traceability
        if: always()
        run: |
          python -m tools.ci.skip_guard artifacts/junit.xml --forbid 'build the' > skip-report.txt || true
          python -m tools.ci.trace_matrix --junit artifacts/junit.xml --markdown artifacts/trace-matrix.md --json artifacts/trace-matrix.json > /dev/null
          {
            echo "### Python ${{ matrix.python-version }}"
            echo '```'; cat skip-report.txt; echo '```'
            echo "#### Test-case traceability (docs/TEST_CASES.md)"
            cat artifacts/trace-matrix.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-python-${{ matrix.python-version }}
          path: artifacts/

  # Without the compiled Qt apps, test_qt_cluster.py and test_qt_progress.py skip, so a green
  # `pytest` job says nothing about Qt. This job builds them and fails if any such test skips.
  qt:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      UPSTREAM_PIN: 793452919127065536bcb7a08f98838fa963d75e  # keep equal to PIN in dashboard/qt_cluster/build.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt 5.15 build and runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential qt5-qmake qtbase5-dev qtdeclarative5-dev \
            qtquickcontrols2-5-dev qml-module-qtquick2 qml-module-qtquick-controls2 qml-module-qtquick-window2 \
            qml-module-qtquick-shapes qml-module-qtquick-layouts qml-module-qtquick-templates2 \
            qml-module-qtgraphicaleffects xvfb libgl1-mesa-dri libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - run: python -m pip install '.[verification,cockpit]'
      - name: Fetch pinned upstream dashboard
        run: |
          git clone --quiet https://github.com/whitfijs-jw/Volvo240-DigitalDash "$RUNNER_TEMP/volvo"
          git -C "$RUNNER_TEMP/volvo" checkout --quiet "$UPSTREAM_PIN"
      - name: Build cluster and progress panel
        run: |
          python dashboard/qt_cluster/build.py --source "$RUNNER_TEMP/volvo"
          python dashboard/qt_progress/build.py
      - name: Qt tests under a virtual display
        run: xvfb-run -a python -m pytest -q tests/test_qt_cluster.py tests/test_qt_progress.py tests/test_qt_source.py --junitxml=artifacts/qt-junit.xml
      - name: No Qt test may be skipped
        if: always()
        run: python -m tools.ci.skip_guard artifacts/qt-junit.xml --forbid 'build the|Qt' --max-skipped 0
      - name: Preserve build log and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-build
          path: |
            artifacts/
            .demo/qt-build/build.log
            .demo/progress-build/build.log
