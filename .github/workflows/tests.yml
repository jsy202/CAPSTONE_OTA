name: minimal-ota-tests
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal package
        run: python -m pip install '.[verification]'
      - name: Console command
        run: ota --help
      - name: Test real signed HTTP updates and A/B recovery
        run: python -m pytest -q --junitxml=artifacts/junit.xml --cov=capstone_ota --cov-branch --cov-report=xml:artifacts/coverage.xml --alluredir=artifacts/allure-results
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-python-${{ matrix.python-version }}
          path: artifacts/
