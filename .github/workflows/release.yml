name: ivi-release
# Tag `ivi-v3.0.0` -> test -> build and sign the IVI release -> attach it to a GitHub Release.
# Manual run (workflow_dispatch) builds with a throwaway key and never publishes anything.
on:
  push:
    tags: ["ivi-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "IVI version from release/versions.json (e.g. 3.0.0)"
        required: true
        default: "3.0.0"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[verification,cockpit]'
      - name: Run the full test suite before anything is signed
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Holds the OTA_SIGNING_KEY secret. In repo Settings > Environments, add required reviewers
    # and restrict this environment to tags matching `ivi-v*`.
    environment: release-signing
    permissions:
      contents: write   # only needed to create the GitHub Release on tag pushes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Resolve version
        id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then v="${GITHUB_REF_NAME#ivi-v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Tag must point at a commit that is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Choose signing key
        id: key
        env:
          SECRET_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -n "$SECRET_KEY" ]; then
            echo "mode=production" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::error::OTA_SIGNING_KEY is not set; refusing to publish an unsigned/dry-run release"; exit 1
          else
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            python - <<'PY' >> "$GITHUB_ENV"
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          pem = Ed25519PrivateKey.generate().private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8,
                                                          serialization.NoEncryption()).decode()
          print("OTA_SIGNING_KEY<<EOF\n" + pem + "EOF")
          PY
          fi
      - name: Build, sign, and self-verify the release
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY || env.OTA_SIGNING_KEY }}
        run: python -m tools.ci.make_release --version "${{ steps.v.outputs.version }}" --output out
      - name: Re-check hashes from the published file list
        run: cd out/release && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ivi-${{ steps.v.outputs.version }}-${{ steps.key.outputs.mode }}
          path: out/release/
      - name: Publish GitHub Release
        if: github.event_name == 'push' && steps.key.outputs.mode == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "IVI ${{ steps.v.outputs.version }} built from \`$GITHUB_SHA\` after the full test suite passed."
            echo; echo "Verify with release-public.pem (Ed25519). SHA-256:"; echo '```'; cat out/release/SHA256SUMS; echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/release/* --verify-tag --title "IVI ${{ steps.v.outputs.version }}" --notes-file notes.md
