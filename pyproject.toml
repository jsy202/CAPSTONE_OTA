[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-ota"
version = "0.1.0"
description = "Minimal signed, single-device application OTA with A/B recovery"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41,<47",
]

[project.scripts]
ota = "capstone_ota.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["capstone_ota*"]
