[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-ota"
version = "0.1.0"
description = "Minimal signed, single-device application OTA with A/B recovery"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
verification = ["pytest>=8,<9", "pytest-cov>=5,<8", "allure-pytest>=2.13,<3"]

[project.scripts]
ota = "capstone_ota.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["hardware: opt-in real Raspberry Pi/CAN bench; requires --hardware-config"]

[tool.setuptools.packages.find]
include = ["capstone_ota*"]
