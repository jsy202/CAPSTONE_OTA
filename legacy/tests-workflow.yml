name: tests

# Hardware-free checks only. The zonal integration tests run over real local
# TLS servers and a virtual CAN bus; Raspberry Pi, MCP2515/SocketCAN and
# systemd/polkit behavior are validated manually (docs/ZONAL_OTA_GUIDE.md).
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install .
      - name: Console entry points resolve
        run: |
          capstone-ota-publish --help >/dev/null
          capstone-ota-agent --help >/dev/null
          capstone-ota-coordinator --help >/dev/null
          capstone-ota-zone-agent --help >/dev/null
      - name: Shell script syntax
        run: for script in ota/scripts/*.sh dashboard/volvo-digital-dash/*.sh; do bash -n "$script"; done
      - name: Tests
        run: python -m pytest -q
